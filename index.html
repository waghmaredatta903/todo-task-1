<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo fetch 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(135deg, #f97316, #ec4899);
        }

        .spinner {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(255, 255, 255, .8);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
    border: none;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    overflow: hidden;
}

.card-body {
    padding: 30px;
}

.card h2,
.card h3,
.card h4 {
    font-weight: 700;
    color: #172033;
}

.form-control {
    height: 55px;
    border: 1px solid #d6dbe5;
    border-radius: 10px;
    font-size: 17px;
    padding: 12px 16px;
    transition: all 0.3s ease;
}

.form-control:focus {
    border-color: #ff9800;
    box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.15);
}

.btn {
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 16px;
    transition: all 0.3s ease;
}

.btn-outline-warning:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(255, 193, 7, 0.25);
}

.btn-outline-danger:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(220, 53, 69, 0.25);
}

.list-group-item {
    padding: 20px 25px;
    border-color: #e5e7eb;
    transition: all 0.3s ease;
}

.list-group-item:hover {
    background: #fafafa;
    transform: translateX(3px);
}

.list-group-item strong {
    font-size: 18px;
    color: #172033;
}
h1 {
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 30px;
}
.my-swal-icon {
    color: #ff6347 !important;
    border-color: #ff6347 !important;
}
    </style>
</head>

<body>
    <h4 class="text-center mt-5">TODO CRUDE WITH FETCH 1</h4>
    <div class="container mt-4">
        <div class="row align-items-start">
            <div class="col-md-4">
                <div class="card h-100">
                    <div class="card-body rounded-6 shadow-33">
                        <h4>Add The Todos</h4>
                        <form id="todoForm">
                            <div class="form-group">
                                <lable for="inputControl">ENTER TODO !!!</lable>
                                <input type="text" class="form-control" id="inputControl" autocomplete="off" required>
                            </div>
                            <div>
                                <button id="addTodoBtn" class="btn btn-outline-warning btn-block">Add Todo</button>
                                <button id="updateTodoBtn" class="btn btn-outline-success btn-block d-none">Update
                                    Todo</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h3>Todo List</h3>
                        <ul clas="list-group" id="todoContainer">
                            <!-- <li class="list-group-item d-flex justify-content-between">
                                <strong>CSS</strong>
                                <div>
                                    <button type="submit" class="btn btn-outline-warning">Warning</button>
                                    <button type="button" class="btn btn-outline-danger">Danger</button>

                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="spinner" id="spinner">
        <div class="spinner-border text-success" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/app.js"></script>
</body>

</html>
